frontend_premerge_checks:
  extends: .cache_pnpm
  image: $IMAGE_FRONTEND
  variables: !reference [.variables, common]
  artifacts:
    paths:
      - frontend/junit.xml
    expire_in: 1 day
    reports:
      junit:
        - frontend/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
      changes: !reference [.changes, frontend_build]
  before_script:
    - git fetch --unshallow origin || true
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - cd $FRONTEND_PATH
    - !reference [.scripts, install_frontend_dependencies]
  script:
    - !reference [.scripts, sync_astro_types]
    - pnpm pc
    - pnpm exec vitest run --changed origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
