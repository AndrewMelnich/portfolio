gitleaks:
  image: $IMAGE_FRONTEND
  stage: test
  variables: !reference [.variables, common]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "master"
  script:
    - |
      set -euo pipefail
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl git
      GITLEAKS_VERSION="8.30.1"
      GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
      echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
      tar -xzf gitleaks.tar.gz gitleaks
      install -m 0755 gitleaks /usr/local/bin/gitleaks
      rm -f gitleaks.tar.gz gitleaks
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        HEAD="$CI_COMMIT_SHA"
      else
        BASE="${CI_COMMIT_BEFORE_SHA:-}"
        HEAD="$CI_COMMIT_SHA"
      fi
      if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
        LOG_OPTS="$HEAD"
      else
        git cat-file -e "${BASE}^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE"
        LOG_OPTS="${BASE}..${HEAD}"
      fi
      echo "gitleaks range: ${LOG_OPTS}"
      gitleaks git --no-banner --no-color --redact --verbose --log-opts="${LOG_OPTS}"
